name: Build RunExport APK

on:
  push:
    paths:
      - "run-export/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: run-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunExport-apk
          path: run-export/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to "apk-latest" release (휴대폰에서 바로 받기용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RunExport.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RunExport.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "RunExport 최신 빌드" \
            --notes "브랜치: ${{ github.ref_name }} / 커밋: ${{ github.sha }}. 휴대폰에서 RunExport.apk 를 눌러 받은 뒤 설치하세요."
